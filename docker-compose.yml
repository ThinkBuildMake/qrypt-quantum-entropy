# Local Postgres 18 for real users with Docker. `make db-up` uses this when a Docker daemon is reachable
# and falls back to a per-worktree database on a local server otherwise (see docs/DEVIATIONS.md).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: qrypt
      POSTGRES_PASSWORD: qrypt
      POSTGRES_DB: qrypt
    ports:
      - "${QRYPT_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrypt -d qrypt"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - qrypt_pgdata:/var/lib/postgresql
volumes:
  qrypt_pgdata:
