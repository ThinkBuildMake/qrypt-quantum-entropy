[project]
name = "qrypt-entropy"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "openai==3.24.0",
    "prometheus-client>=0.26.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qrypt_entropy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["qrypt_entropy"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "TID"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608", "S311", "S603", "S607"]
"scripts/**" = ["S603", "S607"]
"tools/**" = ["S603", "S607"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
